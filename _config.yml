# ─────────────────────────────────────────────────────────────
#  ABneteja — configuració del lloc
#  Català com a llengua arrel (/), castellà a /es/
# ─────────────────────────────────────────────────────────────

title:       "ABneteja"
description: "Neteja professional per a comunitats de propietaris, oficines, clíniques i locals comercials al Baix Llobregat."
url:         "https://abneteja.com"
baseurl:     ""

lang_default: ca

markdown: kramdown
plugins:
  - jekyll-sitemap

timezone: "Europe/Madrid"

# Valors per defecte: tota pàgina usa el layout "page" i, si no diu
# res, s'assumeix català.
defaults:
  - scope:
      path: ""
    values:
      layout: page
      lang: ca
  - scope:
      path: "es"
    values:
      layout: page
      lang: es

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .jekyll-cache
  - node_modules
