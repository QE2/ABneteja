      - "Nau o magatzem"
      - "Local comercial"
      - "Vidres, rètols o neteja tècnica"
      - "Altres"
    missatge:    "Què necessiteu"
    missatge_ph: "Metres quadrats, freqüència, horaris que us van bé…"
